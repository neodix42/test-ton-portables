name: Test linux arm64 portable binaries and DEB packages in docker

on: [push,workflow_dispatch,workflow_call]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  portables:
    name: Portable binaries (${{ matrix.docker-file }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        docker-file:
          - dockerfile-ubuntu-22
          - dockerfile-ubuntu-24
          - dockerfile-ubuntu-25
          - dockerfile-ubuntu-26
          - dockerfile-debian-12
          - dockerfile-redhat-9
          - dockerfile-fedora
          - dockerfile-opensuse-leap-15

    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.11.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install fuse & libfuse2 on github server
        run: |
          sudo apt install fuse libfuse2

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          load: true
          push: false
          context: ./
          file: ./${{ matrix.docker-file }}
          tags: ${{ matrix.docker-file }}

      - name: Show images
        run: docker images

      - name: Test portable binaries
        run: docker run --rm --privileged --cap-add=ALL -e ARCH='arm64' --entrypoint /app/test-portables.sh ${{ matrix.docker-file }}

  deb:
    name: DEB packages (${{ matrix.docker-file }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        docker-file:
          - dockerfile-ubuntu-22
          - dockerfile-ubuntu-24

    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.11.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install fuse & libfuse2 on github server
        run: |
          sudo apt install fuse libfuse2

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          load: true
          push: false
          context: ./
          file: ./${{ matrix.docker-file }}
          tags: ${{ matrix.docker-file }}

      - name: Show images
        run: docker images

      - name: Test deb packages
        run: docker run --rm --privileged --cap-add=ALL -e ARCH='arm64' --entrypoint /app/test-deb.sh ${{ matrix.docker-file }}
